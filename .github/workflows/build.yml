name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/hiddenmedia/scanner
          mv MainActivity.kt app/src/main/java/com/hiddenmedia/scanner/MainActivity.kt
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv app.gradle.kts app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HiddenMediaFinder-apk
          path: app/build/outputs/apk/debug/app-debug.apk
